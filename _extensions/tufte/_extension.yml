title: Tufte handout
author: tufte-typst
version: 1.0.0
quarto-required: ">=1.7.0"
contributes:
  formats:
    # Used as `format: tufte-typst`. Renders a Tufte handout to PDF via Typst.
    # The HTML copy comes from the project's post-render step (render-html.sh),
    # which a format extension cannot declare itself.
    typst:
      keep-typ: true
      template-partials:
        - typst-template.typ
        - typst-show.typ
      filters:
        - at: pre-ast
          path: tufte.lua
