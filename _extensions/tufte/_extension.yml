title: Tufte handout
author: tufte-typst
version: 1.0.0
quarto-required: ">=1.7.0"
contributes:
  formats:
    # Used as `format: tufte-typst`. Renders a Tufte handout to PDF via Typst.
    # The HTML copy comes from the project's post-render step (render-html.sh),
    # which a format extension cannot declare itself.
    typst:
      keep-typ: true
      # The bundled EB Garamond (see fonts/OFL.txt); the HTML embeds the same files.
      font-paths:
        - _extensions/tufte/fonts
      # Citations: full entry in the margin first, "Author Year" after.
      # A handout sets `reference-list: false` to drop the list at the end.
      bibliographystyle: chicago-author-date
      reference-list: true
      template-partials:
        - typst-template.typ
        - typst-show.typ
        - biblio.typ
      filters:
        - at: pre-ast
          path: tufte.lua
